[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:cacheprovider

markers =
    smoke: Pruebas rapidas para CI/CD (subset minimo)
    happy_path: Flujos principales exitosos (T1-T4, T7, T11, T17)
    anulacion: Anulacion de vales y reversion de stock (T8, T13)
    edge_case: Casos borde: stock insuficiente, cupo excedido (T9, T12)
    concurrency: Pruebas de concurrencia (T10)
    invariantes: Reglas de negocio transversales (T5, T14, T15, T18)
    bodega: Flujos de bodega, despacho y voz (T4, T11, T17)
    slow: Pruebas lentas (concurrencia, carga)
    load: Pruebas de carga (T16)
    audit: Auditoria erp_audit_log (T18)
    routes: Tests de rutas HTTP (test_routes.py)
    routes_criticas: Tests de rutas criticas que mueven estado (test_routes_criticas.py)
