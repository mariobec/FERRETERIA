<svg width="1920" height="480" viewBox="0 0 1920 480" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="lexiaOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8A2A"/>
      <stop offset="100%" stop-color="#F37021"/>
    </linearGradient>
    <linearGradient id="lexiaDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D2430"/>
      <stop offset="100%" stop-color="#0B0F14"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .brand-main { font-family: "Segoe UI", "Montserrat", "Inter", Arial, sans-serif; font-weight: 800; letter-spacing: 2.4px; }
      .brand-sub { font-family: "Segoe UI", "Montserrat", "Inter", Arial, sans-serif; font-weight: 500; letter-spacing: 1px; }
    </style>
  </defs>

  <!-- Icon -->
  <g transform="translate(72,48)" filter="url(#softGlow)">
    <!-- Outer hex frame -->
    <path d="M168 0 L312 84 L312 252 L168 336 L24 252 L24 84 Z" fill="url(#lexiaDark)"/>
    <path d="M168 20 L294 94 L294 242 L168 316 L42 242 L42 94 Z" stroke="#2B3646" stroke-width="4" fill="none"/>

    <!-- Stylized S ribbon -->
    <path d="M84 110 C128 72 196 72 244 106 L220 144 C187 121 143 121 112 146 C95 160 95 179 112 192 C126 203 146 205 173 209 C214 215 248 227 264 253 C287 289 268 324 226 346 C176 372 109 366 60 327 L86 289 C119 318 168 325 204 306 C224 296 230 280 217 267 C205 255 181 251 152 246 C111 239 78 228 61 203 C37 166 50 133 84 110 Z" fill="url(#lexiaOrange)"/>

    <!-- Circuit nodes -->
    <g stroke="#F37021" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M294 112 H352"/>
      <path d="M294 168 H372"/>
      <path d="M294 224 H360"/>
      <path d="M-8 126 H42"/>
      <path d="M-20 184 H42"/>
      <path d="M-2 242 H42"/>
    </g>
    <g fill="#F37021">
      <circle cx="352" cy="112" r="8"/>
      <circle cx="372" cy="168" r="8"/>
      <circle cx="360" cy="224" r="8"/>
      <circle cx="-8" cy="126" r="8"/>
      <circle cx="-20" cy="184" r="8"/>
      <circle cx="-2" cy="242" r="8"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(520,170)">
    <text class="brand-main" x="0" y="78" font-size="108">
      <tspan fill="#F5F7FA">LexIA</tspan><tspan fill="url(#lexiaOrange)"> IA ERP</tspan>
    </text>
    <rect x="0" y="102" width="1280" height="3" fill="#2A3342"/>
    <text class="brand-sub" x="0" y="152" font-size="40" fill="#D5DBE4">Inteligencia operativa</text>
    <text class="brand-sub" x="470" y="152" font-size="40" fill="#F37021">para retail y ferreter&#237;as.</text>
  </g>
</svg>

