<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 230" width="100%" height="100%" role="img" aria-labelledby="lhexiaIconTitle lhexiaIconDesc">
  <title id="lhexiaIconTitle">LhexIA icon</title>
  <desc id="lhexiaIconDesc">Animated premium icon for LhexIA with orange hexagon and monogram.</desc>
  <defs>
    <linearGradient id="hxStroke" x1="42" y1="22" x2="188" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB14D"/>
      <stop offset="0.58" stop-color="#FF7A10"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="hxAccent" x1="92" y1="92" x2="152" y2="152" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB54D"/>
      <stop offset="1" stop-color="#FF6B00"/>
    </linearGradient>
    <linearGradient id="hxWhite" x1="70" y1="70" x2="152" y2="164" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8EAEE"/>
    </linearGradient>
    <filter id="hxShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <filter id="hxGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#FF8A1F" flood-opacity="0.42"/>
    </filter>
  </defs>
  <style>
    #hxRing {
      stroke-dasharray: 520;
      stroke-dashoffset: 520;
      transform-origin: 115px 104px;
      animation: hxDraw 1.35s cubic-bezier(.22,.61,.36,1) forwards, hxBreath 4.6s ease-in-out 1.45s infinite;
    }
    #hxCore {
      opacity: 0;
      transform: translateY(10px);
      transform-origin: 108px 118px;
      animation: hxReveal .72s cubic-bezier(.2,.8,.2,1) .42s forwards;
    }
    #hxSlash, #hxCheck {
      opacity: 0;
      transform: translateY(9px) scale(.94);
      transform-origin: 118px 118px;
      animation: hxAccentReveal .72s cubic-bezier(.16,1,.3,1) .86s forwards;
    }
    #hxWhiteDot {
      opacity: 0;
      transform: scale(.5);
      transform-origin: 127px 69px;
      animation: hxDotReveal .35s ease 1.02s forwards, hxDotFloat 3.8s ease-in-out 1.6s infinite;
    }
    #hxOrangeDot {
      opacity: 0;
      transform: scale(.45);
      transform-origin: 144px 115px;
      animation: hxDotReveal .35s ease 1.12s forwards, hxSpark 3.2s ease-in-out 1.8s infinite;
    }
    @keyframes hxDraw {
      from { stroke-dashoffset: 520; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes hxReveal {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes hxAccentReveal {
      from { opacity: 0; transform: translateY(9px) scale(.94); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes hxDotReveal {
      from { opacity: 0; transform: scale(.45); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes hxBreath {
      0%, 100% { filter: url(#hxGlow); }
      50% { filter: url(#hxShadow); }
    }
    @keyframes hxDotFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-2px) scale(1.04); }
    }
    @keyframes hxSpark {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.12); opacity: .86; }
    }
    @media (prefers-reduced-motion: reduce) {
      #hxRing, #hxCore, #hxSlash, #hxCheck, #hxWhiteDot, #hxOrangeDot { animation: none; }
      #hxRing { stroke-dashoffset: 0; filter: url(#hxShadow); }
      #hxCore, #hxSlash, #hxCheck, #hxWhiteDot, #hxOrangeDot { opacity: 1; transform: none; }
    }
  </style>

  <g filter="url(#hxShadow)">
    <polygon id="hxRing" points="115,20 188,62 188,146 115,188 42,146 42,62"
             fill="none" stroke="url(#hxStroke)" stroke-width="10" stroke-linejoin="round" />
    <path id="hxCore" d="M 70,70 L 104,70 L 104,136 L 152,136 L 152,164 L 70,164 Z" fill="url(#hxWhite)" />
    <path id="hxSlash" d="M 95,116 L 126,94 L 144,108 L 113,130 Z" fill="url(#hxAccent)" />
    <circle id="hxWhiteDot" cx="127" cy="69" r="8" fill="#FFFFFF" />
    <path id="hxCheck" d="M 97,113 L 126,134 L 145,110 L 152,116 L 129,145 L 92,118 Z" fill="#FF7A10" />
    <circle id="hxOrangeDot" cx="144" cy="115" r="8" fill="#FF8A1F" />
  </g>
</svg>
