<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 300" fill="none" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">LhexIA ERP</title>
  <desc id="logoDesc">Logo premium renovado de LhexIA ERP con isotipo hexagonal, wordmark más contundente y tagline corporativo.</desc>
  <defs>
    <linearGradient id="hexStroke" x1="18" y1="16" x2="208" y2="206" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB14D"/>
      <stop offset="0.56" stop-color="#FF7A10"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="accentFill" x1="98" y1="76" x2="186" y2="166" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB54D"/>
      <stop offset="1" stop-color="#FF7A10"/>
    </linearGradient>
    <linearGradient id="whiteFill" x1="42" y1="42" x2="170" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8EAEE"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
    <filter id="textGlow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g transform="translate(18 34)" filter="url(#softGlow)">
    <polygon
      points="112,0 206,54 206,162 112,216 18,162 18,54"
      fill="none"
      stroke="url(#hexStroke)"
      stroke-width="12"
