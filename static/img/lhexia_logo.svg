    <path d="M54 54h42v98h72v38H54z" fill="url(#whiteFill)"/>
    <path d="M95 122 136 94h51l-43 57H113z" fill="url(#accentFill)"/>
    <path d="M108 128 144 155 130 175 93 148z" fill="#FF7A10"/>
    <circle cx="144" cy="82" r="10" fill="#F8FAFC"/>
    <path d="M106 124 141 149 170 116l10 8-32 39-48-35z" fill="#FF8A1F"/>
  </g>

  <g transform="translate(292 44)" filter="url(#textGlow)">
    <text x="0" y="106" font-family="Segoe UI, Arial, sans-serif" font-size="120" font-weight="800" letter-spacing="-0.065em">
      <tspan fill="#F8FAFC">Lhex</tspan><tspan fill="#FF7A10">IA</tspan>
    </text>
    <text x="612" y="62" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="0.02em">
