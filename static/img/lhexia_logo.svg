<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">LhexIA ERP</title>
  <desc id="logoDesc">Logo transparente de LhexIA ERP con isotipo hexagonal y palabra hexIA.</desc>
  <defs>
    <linearGradient id="lhexiaAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A3D"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <g transform="translate(18 20)">
    <polygon
      points="92,12 162,52 162,132 92,172 22,132 22,52"
      fill="none"
      stroke="url(#lhexiaAccent)"
      stroke-width="8"
      stroke-linejoin="round" />
    <path d="M 50 44 L 84 44 L 84 108 L 136 108 L 136 138 L 50 138 Z" fill="#FFFFFF" />
    <circle cx="120" cy="54" r="8" fill="#FFFFFF" />
    <path d="M 76 114 L 110 90 L 132 106 L 98 130 Z" fill="url(#lhexiaAccent)" />
  </g>

  <g transform="translate(210 28)">
    <text
      x="0"
      y="74"
      font-family="Century Gothic, Futura, Montserrat, Arial, sans-serif"
      font-size="34"
      font-weight="700"
      letter-spacing="1"
      fill="#FFFFFF">ERP</text>
    <text
      x="76"
      y="110"
      font-family="Century Gothic, Futura, Montserrat, Arial, sans-serif"
      font-size="96"
      font-weight="900"
      letter-spacing="-2"
      fill="#FFFFFF">hex<tspan fill="url(#lhexiaAccent)">IA</tspan></text>
    <text
      x="2"
      y="166"
      font-family="Century Gothic, Futura, Montserrat, Arial, sans-serif"
      font-size="26"
      letter-spacing="0.6"
      fill="#D8DEE8">Haz rentable cada decision</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" width="100%" height="100%">
  <!-- FONDO 100% TRANSPARENTE -->
  
  <!-- ==================== ISOTIPO CORREGIDO ==================== -->
  <g transform="translate(10, 10)">
    <!-- La L Blanca de la Base Estructural -->
    <path d="M 40,220 L 40,40 L 85,40 L 85,175 L 190,175 L 190,220 Z" fill="#FFFFFF" />
    
    <!-- El Brazo Inclinado Naranja -->
    <path d="M 75,170 L 145,35 L 190,58 L 120,192 Z" fill="#EA580C" />
    
    <!-- Los 3 Nodos Conectados -->
    <circle cx="145" cy="35" r="15" fill="#EA580C" stroke="#000000" stroke-width="3" />
    <circle cx="108" cy="113" r="15" fill="#EA580C" stroke="#000000" stroke-width="3" />
    <circle cx="205" cy="205" r="15" fill="#EA580C" stroke="#000000" stroke-width="3" />
  </g>

  <!-- ==================== TIPOGRAFÍA CENTURY GOTHIC STYLE ==================== -->
  <text x="255" y="142" font-family="'Century Gothic', 'Futura', 'Segoe UI', sans-serif" font-size="112" font-weight="900" letter-spacing="-4px">
    <tspan fill="#FFFFFF">l</tspan>
    <tspan fill="#EA580C">hex</tspan>
    <tspan fill="#FFFFFF">IA</tspan>
  </text>

  <!-- Subtítulo: Inteligencia Operativa -->
  <text x="260" y="195" font-family="'Century Gothic', 'Futura', 'Segoe UI', sans-serif" font-size="33" font-weight="normal" fill="#FFFFFF" letter-spacing="0.2px">
    Inteligencia Operativa
  </text>

  <!-- Descriptor de Sistema: ERP -->
  <text x="260" y="240" font-family="'Century Gothic', 'Futura', 'Segoe UI', sans-serif" font-size="33" font-weight="bold" fill="#9CA3AF" letter-spacing="1px">
    ERP
  </text>
</svg>
