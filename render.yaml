services:
  - type: web
    name: erp-ferreteria-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python init_db.py && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "0"
      - key: PUBLICO_MUESTRA_PRECIO
        value: "0"
      - key: PUBLICO_MUESTRA_STOCK_EXACTO
        value: "0"
