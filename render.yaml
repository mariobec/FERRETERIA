services:
  - type: web
    name: erp-ferreteria-demo
    runtime: python
    # SD-1 rendimiento: 4 POS + caja + bodega (~6 hilos concurrentes). Ver PLAN_RENDIMIENTO_BD_SD1.md
    plan: standard
    buildCommand: pip install -r requirements.txt
    # Migra/crea tablas y roles antes de levantar Gunicorn (idempotente con schema_sync).
    preDeployCommand: python init_db.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 6 --timeout 90 --graceful-timeout 20 --access-logfile -
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      # Neon: pegar la connection string (pooler recomendado). No commitear secretos.
      - key: DATABASE_URL
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
      # Ej: https://TU-SERVICIO.onrender.com
      - key: PUBLIC_SITE_URL
        sync: false
      # Misma clave en .env.local y Render si usás TV cliente / enlaces firmados (Live Wall).
      # Si usás generateValue, copiá el valor generado desde el dashboard de Render a .env.local.
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "0"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: BEHIND_PROXY
        value: "1"
      - key: PUBLICO_MUESTRA_PRECIO
        value: "0"
      - key: PUBLICO_MUESTRA_STOCK_EXACTO
        value: "0"
      # Pool SQLAlchemy — Neon pooler + 6 estaciones (ver docs/planes/04-tecnico/PLAN_RENDIMIENTO_BD_SD1.md)
      - key: DB_POOL_SIZE
        value: "10"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: DB_POOL_TIMEOUT
        value: "30"
      # Operador IA: cron scan SQL cada 10 min (NO AGENTE_OPERADOR_SCAN_ON_LOAD en prod).
      # POST /api/agente/operador/dispatch-scan Bearer AGENTE_OPERADOR_CRON_SECRET
      # Enriquecimiento Ollama solo PC sucursal (AGENTE_OLLAMA_ENABLED=0 en Render).
      - key: AGENTE_OLLAMA_ENABLED
        value: "0"
      # Piloto SD: ocultar miles de SKUs bajo mínimo en Guardián (catálogo demo Neon).
      - key: OWNER_GUARDIAN_DEMO_LIMPIO
        value: "1"
      # IA Compras / facturas / foto POS (piloto SD). Créditos prepago en platform.openai.com
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_VISION_MODEL
        value: "gpt-4o-mini"
      - key: OPENAI_VISION_DETAIL
        value: "low"
      - key: IA_FACTURA_PDF_PAGINAS
        value: "3"
      # Paridad con defaults de app.py / tienda (opcional; mismo texto que en .env.local).
      - key: EMPRESA_NOMBRE_COMERCIAL
        sync: false
      - key: EMPRESA_RUT
        sync: false
      # Vitrina pública lhexia.cl/tienda/ferreteria-santo-domingo (piloto SD-1)
      - key: VITRINA_TIENDA_HABILITADA
        value: "1"
      - key: VITRINA_PEDIDO_WEB_HABILITADO
        value: "1"
