<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modo Bodega | ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { background: #f6f8fb; }
    .mobile-shell { max-width: 980px; margin: 0 auto; padding: 12px; }
    .top { background: #0f172a; color: #fff; border-radius: 12px; padding: 10px 12px; }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  <div class="mobile-shell">
    <div class="top d-flex justify-content-between align-items-center mb-3">
      <strong><i class="fas fa-warehouse me-2"></i>Modo Tablet Bodega</strong>
      <a href="{{ url_for('lista_recepciones') }}" class="btn btn-sm btn-outline-light">Volver</a>
    </div>
    {% block content %}{% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
