<div class="offcanvas offcanvas-end pos-pedidos-offcanvas" tabindex="-1" id="posPedidosApedidoPanel" aria-labelledby="posPedidosApedidoPanelLabel" data-bs-scroll="true">
  <div class="offcanvas-header pos-pedidos-offcanvas__header border-bottom">
    <div>
      <h5 class="offcanvas-title fw-bold mb-0" id="posPedidosApedidoPanelLabel">
        <i class="fas fa-truck-ramp-box text-warning me-2"></i>Pedidos a pedido
      </h5>
      <p class="small text-muted mb-0">Compromisos de entrega · aviso WhatsApp al cliente</p>
    </div>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
  </div>
  <div class="offcanvas-body pos-pedidos-offcanvas__body d-flex flex-column gap-2 p-0">
    <div class="pos-pedidos-toolbar px-3 pt-2 pb-2 border-bottom bg-light">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
        <div class="d-flex flex-wrap gap-1" role="group" aria-label="Filtro pedidos">
          <button type="button" class="btn btn-sm btn-primary pos-pedidos-filtro active" data-pedidos-filtro="abiertos">Abiertos</button>
          <button type="button" class="btn btn-sm btn-outline-secondary pos-pedidos-filtro" data-pedidos-filtro="todos">Historial</button>
        </div>
        <button type="button" class="btn btn-sm btn-link py-0" id="posPedidosApedidoRefresh" title="Actualizar">
          <i class="fas fa-rotate-right me-1"></i>Actualizar
        </button>
      </div>
      <div class="d-flex flex-wrap gap-2 mt-2 small" id="posPedidosApedidoResumen" aria-live="polite">
        <span class="badge text-bg-secondary">Cargando…</span>
      </div>
    </div>
    <div class="pos-pedidos-list flex-grow-1 overflow-auto px-3 pb-3" id="posPedidosApedidoList" aria-live="polite">
      <p class="text-muted small py-3 mb-0">Cargando pedidos…</p>
    </div>
  </div>
</div>
