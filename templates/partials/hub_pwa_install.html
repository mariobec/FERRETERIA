{% if usuario_tiene_permiso('panel_gerencia') or usuario_tiene_permiso('ver_gerencia') or usuario_tiene_permiso('gestionar_usuarios') %}
<div id="ownerInstallBanner" class="hub-pwa-install d-none" role="region" aria-label="Instalar app Dueño">
  <div class="flex-grow-1">
    <strong>App Dueño en su teléfono</strong>
    <span class="d-block small opacity-90">Semáforo caja e inventario — acceso en un toque</span>
  </div>
  <a href="{{ url_for('owner_mobile') }}" class="btn btn-sm btn-light fw-bold text-dark">Abrir panel</a>
  <button type="button" id="ownerBtnInstall" class="btn btn-sm btn-warning fw-bold text-dark d-none">Instalar</button>
  <button type="button" id="ownerInstallDismiss" class="btn btn-sm btn-outline-light" aria-label="Cerrar">×</button>
</div>
{% endif %}
