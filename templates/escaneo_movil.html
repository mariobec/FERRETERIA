{% extends "base_movil.html" %}
{% block content %}
<div class="container text-center py-3">
    <h4 class="fw-bold mb-3"><i class="fas fa-barcode"></i> Lector de Bodega</h4>
    
    <!-- Contenedor de la Cámara -->
    <div id="reader" class="shadow-sm rounded" style="width: 100%; min-height: 300px; background: #000;"></div>

    <!-- Resultados del Escaneo -->
    <div id="resultado-escaneo" class="mt-4 card p-3 shadow-sm d-none">
        <h5 id="prod-nombre" class="fw-bold text-primary"></h5>
        <p class="mb-1">Stock en Sistema: <span id="prod-stock" class="fw-bold"></span></p>
        <hr>
        <div class="mb-3">
            <label class="form-label fw-bold">Cantidad Contada / Recibida</label>
            <input type="number" id="cantidad-fisica" class="form-control form-control-lg text-center" placeholder="0">
        </div>
        <button id="btn-confirmar" class="btn btn-success btn-lg w-100">
            <i class="fas fa-save"></i> Confirmar Registro
        </button>
    </div>
</div>

<!-- Librería del Escáner -->
<script src="https://unpkg.com"></script>

<script>
    const html5QrCode = new Html5Qrcode("reader");
    const config = { fps: 10, qrbox: { width: 250, height: 150 } };

    // Iniciar escaneo
    html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess);

    function onScanSuccess(decodedText) {
        // Vibración al detectar (en móviles compatibles)
        if (navigator.vibrate) navigator.vibrate(100);
        
        // Llamada a la API para buscar el producto
        fetch(`/api/buscar_producto/${decodedText}`)
            .then(response => response.json())
            .then(data => {
                if (data.status === "success") {
                    document.getElementById('resultado-escaneo').classList.remove('d-none');
                    document.getElementById('prod-nombre').innerText = data.nombre;
                    document.getElementById('prod-stock').innerText = data.stock;
                    window.productoActualId = data.id; // Guardar ID
                } else {
                    alert("Producto no encontrado en el sistema.");
                }
            });
    }

    document.getElementById('btn-confirmar').addEventListener('click', () => {
        const cantidad = document.getElementById('cantidad-fisica').value;
        // Aquí enviarías los datos a la tabla de Recepción o Inventario según el módulo
        alert(`Registrando ${cantidad} unidades del producto ID ${window.productoActualId}`);
        location.reload(); // Reiniciar para el siguiente escaneo
    });
</script>
{% endblock %}
