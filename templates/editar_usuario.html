{% extends 'base.html' %}

{% block content %}
<div class="container-fluid px-0">
  <div class="page-header">
    <div>
      <h3 class="page-title"><i class="fas fa-user-edit me-2 text-success"></i>Editar Usuario</h3>
      <p class="page-subtitle">Actualiza datos de cuenta y rol de acceso.</p>
    </div>
    <a href="{{ url_for('usuarios') }}" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left me-1"></i> Volver</a>
  </div>
  <div class="card card-ds">
    <div class="card-header fw-bold">
      <i class="fas fa-id-card me-2"></i> Datos del Usuario
    </div>
    <div class="card-body">
      <form method="POST">
        <div class="row g-4">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Nombre</label>
            <input type="text" name="nombre" class="form-control" value="{{ usuario.nombre }}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Correo</label>
            <input type="email" name="correo" class="form-control" value="{{ usuario.correo }}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Contraseña (opcional)</label>
            <input type="password" name="password" class="form-control" placeholder="Nueva contraseña">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Rol</label>
            <select name="rol_id" class="form-select" required>
              {% for rol in roles %}
                <option value="{{ rol.id }}" {% if usuario.rol_id == rol.id %}selected{% endif %}>
                  {{ rol.nombre }}
                </option>
              {% endfor %}
            </select>
          </div>
        </div>
        <div class="mt-4 text-end">
          <button type="submit" class="btn btn-ds-primary fw-bold px-4">
            <i class="fas fa-save me-1"></i> Guardar Cambios
          </button>
          <a href="{{ url_for('usuarios') }}" class="btn btn-outline-secondary fw-bold px-4">
            <i class="fas fa-arrow-left me-1"></i> Volver
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
