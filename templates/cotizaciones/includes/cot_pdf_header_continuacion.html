{# Encabezado compacto — páginas 2+ del PDF #}
<div class="doc-header doc-header--continuacion">
  <div class="col-l">
    {% if logo_cliente_b64 %}
    <img class="cot-membrete__logo doc-header__logo-sm" src="data:image/png;base64,{{ logo_cliente_b64 }}" alt="">
    {% endif %}
    <div class="doc-header__empresa-sm">{{ empresa.nombre_comercial or 'Ferretería Santo Domingo' }}</div>
  </div>
  <div class="col-r">
    <div class="doc-continuacion-label">CONTINUACIÓN DE COTIZACIÓN</div>
    <div class="doc-num">{{ cotizacion.numero }}</div>
    <div class="doc-meta">Página {{ pagina.numero }} de {{ pagina.total }}</div>
  </div>
</div>
