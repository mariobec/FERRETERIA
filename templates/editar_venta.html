{% extends 'base.html' %}

{% block content %}
<div class="container-fluid px-0">
    <div class="page-header">
        <div>
            <h1 class="page-title">Editar Venta</h1>
            <p class="page-subtitle">Actualiza vendedor, productos y montos de una venta registrada.</p>
        </div>
        <a href="{{ url_for('mostrar_ventas') }}" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left me-1"></i> Volver</a>
    </div>

    <!-- Formulario de Edición -->
    <div class="card card-ds">
        <div class="card-header">
            <h5 class="fw-bold m-0">Actualizar Datos de la Venta</h5>
        </div>
        <div class="card-body">
            <form action="{{ url_for('editar_venta', id=venta.id) }}" method="POST" class="row g-3">
                <!-- Cabecera -->
                <div class="col-md-4">
                    <label class="form-label fw-bold">Usuario</label>
                    <input type="text" name="usuario" value="{{ venta.usuario }}" class="form-control" required>
                </div>

                <!-- Detalles dinámicos -->
                <div class="col-md-12">
                    <h5 class="fw-bold mt-4">Productos de la Venta</h5>
                </div>

                <div id="detalle-container" class="col-md-12">
                    {% for d in venta.detalles %}
                    <div class="row g-3 mb-3 detalle-item">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Producto</label>
                            <select name="id_producto[]" class="form-control" required>
                                {% for p in productos %}
                                <option value="{{ p.id }}" {% if p.id == d.id_producto %}selected{% endif %}>{{ p.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-bold">Cantidad</label>
                            <input type="number" name="cantidad[]" value="{{ d.cantidad }}" class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Precio Unitario</label>
                            <input type="number" step="0.01" name="precio_unitario[]" value="{{ d.precio_unitario }}" class="form-control" required>
                        </div>
                        <div class="col-md-2 d-flex align-items-end">
                            <button type="button" class="btn btn-outline-danger remove-detalle"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                    {% endfor %}
                </div>

                <!-- Botón para agregar más productos -->
                <div class="col-md-12">
                    <button type="button" id="add-detalle" class="btn btn-outline-info fw-bold">
                        <i class="fas fa-plus me-2"></i> Agregar Producto
                    </button>
                </div>

                <!-- Botones de acción -->
                <div class="col-md-12 d-flex justify-content-end mt-4">
                    <button type="submit" class="btn btn-ds-primary btn-lg px-5 fw-bold">
                        <i class="fas fa-save me-2"></i> Guardar Cambios
                    </button>
                    <a href="{{ url_for('mostrar_ventas') }}" class="btn btn-outline-secondary btn-lg px-5 fw-bold ms-3">
                        <i class="fas fa-arrow-left me-2"></i> Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Script para manejar detalles dinámicos -->
<script>
document.getElementById('add-detalle').addEventListener('click', function() {
    const container = document.getElementById('detalle-container');
    const newDetalle = document.createElement('div');
    newDetalle.classList.add('row', 'g-3', 'mb-3', 'detalle-item');
    newDetalle.innerHTML = `
        <div class="col-md-4">
            <label class="form-label fw-bold">Producto</label>
            <select name="id_producto[]" class="form-control" required>
                {% for p in productos %}
                <option value="{{ p.id }}">{{ p.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-2">
            <label class="form-label fw-bold">Cantidad</label>
            <input type="number" name="cantidad[]" class="form-control" required>
        </div>
        <div class="col-md-3">
            <label class="form-label fw-bold">Precio Unitario</label>
            <input type="number" step="0.01" name="precio_unitario[]" class="form-control" required>
        </div>
        <div class="col-md-2 d-flex align-items-end">
            <button type="button" class="btn btn-outline-danger remove-detalle"><i class="fas fa-trash"></i></button>
        </div>
    `;
    container.appendChild(newDetalle);

    // Botón eliminar
    newDetalle.querySelector('.remove-detalle').addEventListener('click', function() {
        newDetalle.remove();
    });
});

// Activar eliminar en los existentes
document.querySelectorAll('.remove-detalle').forEach(btn => {
    btn.addEventListener('click', function() {
        btn.closest('.detalle-item').remove();
    });
});
</script>
{% endblock %}
