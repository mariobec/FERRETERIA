{% extends 'base.html' %}

{% block content %}
<div class="container-fluid px-0">
  <div class="page-header">
    <div>
      <h2 class="page-title"><i class="fas fa-key me-2 text-warning"></i>Cambio de Contraseña</h2>
      <p class="page-subtitle">Actualiza tu clave para continuar en el sistema.</p>
    </div>
  </div>

  <div class="card card-ds" style="max-width: 620px;">
    <div class="card-header fw-bold">
      <i class="fas fa-user-shield me-2"></i>Seguridad de Cuenta
    </div>
    <div class="card-body">
      <form method="POST" action="{{ url_for('cambiar_password') }}">
        <div class="mb-3">
          <label class="form-label fw-semibold">Contraseña actual</label>
          <input type="password" name="password_actual" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Nueva contraseña</label>
          <input type="password" name="password_nueva" class="form-control" minlength="8" required>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Confirmar nueva contraseña</label>
          <input type="password" name="password_confirmar" class="form-control" minlength="8" required>
        </div>
        <div class="text-end">
          <button type="submit" class="btn btn-ds-primary fw-bold px-4">
            <i class="fas fa-save me-1"></i> Actualizar Contraseña
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
